name: Assignment Portal CI

permissions:
  contents: read
  pages: write
  id-token: write

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Run Assignment Portal Tests
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check Python
        shell: powershell
        run: |
          $python = "C:\Users\JPC\Assignment-Submission-Portal\.venv\Scripts\python.exe"
          & $python --version
          & $python -c "import sys; print(sys.executable)"

      - name: Install Dependencies
        shell: powershell
        run: |
          $python = "C:\Users\JPC\Assignment-Submission-Portal\.venv\Scripts\python.exe"
          & $python -m pip install -r requirements.txt

      - name: Create Reports Folder
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force reports

      - name: Run Pytest
        id: tests
        continue-on-error: true
        shell: powershell
        run: |
          $python = "C:\Users\JPC\Assignment-Submission-Portal\.venv\Scripts\python.exe"
          & $python -m pytest -v --import-mode=importlib tests --junitxml=reports/junit.xml

      - name: Generate JSON Report
        if: always()
        shell: powershell
        run: |
          $python = "C:\Users\JPC\Assignment-Submission-Portal\.venv\Scripts\python.exe"
          & $python generate_report.py

      - name: Send Report to Local Computer
        if: always()
        shell: powershell
        run: |
          Invoke-RestMethod `
            -Uri "http://127.0.0.1:5001/report" `
            -Method Post `
            -ContentType "application/json" `
            -InFile "test-report.json"

      - name: Send Email Report
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          to: ${{ secrets.REPORT_EMAIL_TO }}
          from: ${{ secrets.MAIL_USERNAME }}
          subject: "Assignment Portal CI - ${{ steps.tests.outcome }}"
          body: |
            Assignment Portal CI Report

            Repository: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Run ID: ${{ github.run_id }}
            Test Result: ${{ steps.tests.outcome }}

            Detailed test report is attached.
          attachments: test-report.json

      - name: Mark Pipeline Failed if Tests Failed
        if: steps.tests.outcome == 'failure'
        shell: powershell
        run: |
          Write-Error "One or more tests failed."

  deploy:
    name: Deploy to GitHub Pages
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
