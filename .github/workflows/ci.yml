name: Assignment Portal CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Run Assignment Portal Tests
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check Python
        shell: powershell
        run: |
          $python = "C:\Users\JPC\Assignment-Submission-Portal\.venv\Scripts\python.exe"
          & $python --version
          & $python -c "import sys; print(sys.executable)"

      - name: Install Dependencies
        shell: powershell
        run: |
          $python = "C:\Users\JPC\Assignment-Submission-Portal\.venv\Scripts\python.exe"
          & $python -m pip install -r requirements.txt

      - name: Create Reports Folder
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force reports

      - name: Run Pytest
        id: tests
        continue-on-error: true
        shell: powershell
        run: |
          $python = "C:\Users\JPC\Assignment-Submission-Portal\.venv\Scripts\python.exe"
          & $python -m pytest -v --junitxml=reports/junit.xml

      - name: Generate JSON Report
        if: always()
        shell: powershell
        run: |
          $python = "C:\Users\JPC\Assignment-Submission-Portal\.venv\Scripts\python.exe"
          & $python generate_report.py

      - name: Send Report to Local Computer
        if: always()
        shell: powershell
        run: |
          Invoke-RestMethod `
            -Uri "http://127.0.0.1:5001/report" `
            -Method Post `
            -ContentType "application/json" `
            -InFile "test-report.json"

      - name: Mark Pipeline Failed if Tests Failed
        if: steps.tests.outcome == 'failure'
        shell: powershell
        run: |
          Write-Error "One or more tests failed."
